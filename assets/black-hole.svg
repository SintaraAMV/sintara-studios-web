<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
<defs>
  <radialGradient id="space" cx="68%" cy="48%" r="68%">
    <stop offset="0" stop-color="#24110a"/>
    <stop offset=".38" stop-color="#0e0807"/>
    <stop offset="1" stop-color="#020202"/>
  </radialGradient>
  <linearGradient id="disk" x1="0" x2="1">
    <stop offset="0" stop-color="#c9d3df"/>
    <stop offset=".2" stop-color="#fff5da"/>
    <stop offset=".46" stop-color="#fff09a"/>
    <stop offset=".64" stop-color="#ffad2e"/>
    <stop offset=".82" stop-color="#f15b19"/>
    <stop offset="1" stop-color="#5d180c"/>
  </linearGradient>
  <filter id="diskGlow" x="-50%" y="-120%" width="200%" height="340%">
    <feGaussianBlur stdDeviation="16" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="halo" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="28"/>
  </filter>
  <filter id="grain">
    <feTurbulence type="fractalNoise" baseFrequency=".015 .03" numOctaves="3" seed="9" result="n">
      <animate attributeName="baseFrequency" values=".015 .03;.022 .025;.015 .03" dur="16s" repeatCount="indefinite"/>
    </feTurbulence>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="18" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</defs>

<rect width="1600" height="900" fill="url(#space)"/>

<g opacity=".42" fill="#fff">
  <circle cx="210" cy="180" r="1.6"/>
  <circle cx="335" cy="310" r="1.1"/>
  <circle cx="155" cy="520" r="1.2"/>
  <circle cx="455" cy="125" r="1.4"/>
  <circle cx="520" cy="710" r="1"/>
  <circle cx="1380" cy="125" r="1.1"/>
</g>

<g transform="translate(1120 440) rotate(-7)">
  <ellipse rx="430" ry="88" fill="none" stroke="url(#disk)" stroke-width="52" opacity=".44" filter="url(#halo)">
    <animate attributeName="rx" values="420;438;425;420" dur="10s" repeatCount="indefinite"/>
  </ellipse>

  <g filter="url(#grain)">
    <ellipse rx="430" ry="77" fill="none" stroke="url(#disk)" stroke-width="23" filter="url(#diskGlow)">
      <animateTransform attributeName="transform" type="rotate" values="0;360" dur="30s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse rx="365" ry="57" fill="none" stroke="#fff1be" stroke-width="7" opacity=".66">
      <animateTransform attributeName="transform" type="rotate" values="360;0" dur="22s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <circle r="178" fill="#000"/>
  <circle r="190" fill="none" stroke="#ffe7a5" stroke-width="9" opacity=".95" filter="url(#diskGlow)">
    <animate attributeName="opacity" values=".68;1;.72;.68" dur="6s" repeatCount="indefinite"/>
  </circle>

  <path d="M-205-122c98-112 268-128 385-28" fill="none" stroke="#fff3b8" stroke-width="17" opacity=".72" filter="url(#diskGlow)"/>
  <path d="M-192 142c105 91 256 101 371 18" fill="none" stroke="#e54d17" stroke-width="25" opacity=".55" filter="url(#halo)"/>
</g>
</svg>