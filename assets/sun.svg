<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
<defs>
  <radialGradient id="sunCore" cx="38%" cy="34%" r="72%">
    <stop offset="0" stop-color="#fff8bf"/>
    <stop offset=".15" stop-color="#ffe257"/>
    <stop offset=".38" stop-color="#ffad12"/>
    <stop offset=".68" stop-color="#ff6500"/>
    <stop offset=".92" stop-color="#c72f00"/>
    <stop offset="1" stop-color="#7f1300"/>
  </radialGradient>
  <radialGradient id="corona" cx="50%" cy="50%" r="50%">
    <stop offset=".56" stop-color="#ffb20d" stop-opacity="0"/>
    <stop offset=".72" stop-color="#ffae00" stop-opacity=".32"/>
    <stop offset=".88" stop-color="#ff7b00" stop-opacity=".12"/>
    <stop offset="1" stop-color="#ff7b00" stop-opacity="0"/>
  </radialGradient>
  <filter id="surface">
    <feTurbulence type="fractalNoise" baseFrequency=".035 .045" numOctaves="4" seed="17" result="noise">
      <animate attributeName="baseFrequency" dur="18s" values=".035 .045;.043 .037;.035 .045" repeatCount="indefinite"/>
    </feTurbulence>
    <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
    <feDisplacementMap in="SourceGraphic" in2="mono" scale="22" xChannelSelector="R" yChannelSelector="B"/>
  </filter>
  <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="22" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="wideGlow" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="42"/>
  </filter>
  <clipPath id="sunClip"><circle cx="1165" cy="455" r="295"/></clipPath>
</defs>

<rect width="1600" height="900" fill="#020202"/>

<g opacity=".78">
  <circle cx="1165" cy="455" r="420" fill="url(#corona)">
    <animate attributeName="r" values="405;425;412;405" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".64;.86;.7;.64" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1165" cy="455" r="325" fill="#ff8a00" opacity=".26" filter="url(#wideGlow)">
    <animate attributeName="opacity" values=".18;.34;.2;.18" dur="6.5s" repeatCount="indefinite"/>
  </circle>
</g>

<g filter="url(#surface)">
  <circle cx="1165" cy="455" r="295" fill="url(#sunCore)"/>
</g>

<g clip-path="url(#sunClip)" opacity=".72">
  <g fill="none" stroke-linecap="round">
    <path d="M935 525c95-112 156-70 225-118 74-51 118-12 206-88" stroke="#fff083" stroke-width="15" opacity=".55">
      <animate attributeName="d" dur="12s" repeatCount="indefinite"
        values="M935 525c95-112 156-70 225-118 74-51 118-12 206-88;
                M930 512c102-95 163-66 228-105 77-46 126-16 211-75;
                M935 525c95-112 156-70 225-118 74-51 118-12 206-88"/>
    </path>
    <path d="M1010 330c74 58 135 24 191 69 72 58 82 121 176 113" stroke="#ffd255" stroke-width="10" opacity=".52"/>
    <path d="M1015 645c70-42 132-41 197 0 54 34 113 36 165 6" stroke="#ffbf35" stroke-width="12" opacity=".55"/>
  </g>
</g>

<g fill="none" stroke="#ffae1c" stroke-linecap="round" opacity=".42" filter="url(#softGlow)">
  <path d="M987 169c-14-71 20-119 74-132 62-15 96 31 130 68" stroke-width="9">
    <animate attributeName="opacity" values=".2;.58;.24;.2" dur="7s" repeatCount="indefinite"/>
  </path>
  <path d="M1370 609c72-2 121 31 128 78 8 55-38 82-83 102" stroke-width="8">
    <animate attributeName="opacity" values=".18;.5;.25;.18" dur="9s" repeatCount="indefinite"/>
  </path>
</g>
</svg>